name: omni_route
description: "Simple screens, routes and Bloc scoping for Flutter, built on go_router and flutter_bloc."
version: 0.2.2
publish_to: none # remove before first release (see doc/release.md)

topics:
  - navigation
  - routing
  - bloc
  - go-router

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.4
  meta: ^1.18.0
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: ^3.0.10

